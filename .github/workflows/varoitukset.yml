name: Huijausvaroitukset
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"   # 3 tunnin välein
permissions:
  contents: write
concurrency: { group: varoitukset, cancel-in-progress: false }
jobs:
  paivita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tyokalut/varoitukset.py
      - name: Tallenna
        run: |
          git config user.name "keraysvahti"; git config user.email "keraysvahti@users.noreply.github.com"
          git add huijaukset/varoitukset.json && (git commit -m "Huijausvaroitukset päivitetty" && git pull --rebase && git push) || echo "ei muutoksia"
